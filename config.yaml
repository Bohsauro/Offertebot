# Configurazione di default per OfferteBot

general:
  default_check_interval_minutes: 15
  default_min_score: 7.0
  max_deals_per_command: 10
  default_estimated_shipping_international: 9.99

# Prodotti pre-configurati da monitorare (console richieste)
default_searches:
  - query: "New Nintendo 2DS XL"
    target_price: 130.0
    min_price: 45.0
    exclude_broken: false
    enabled: true
  - query: "New Nintendo 3DS XL"
    target_price: 170.0
    min_price: 55.0
    exclude_broken: false
    enabled: true
  - query: "New Nintendo 3DS"
    target_price: 140.0
    min_price: 50.0
    exclude_broken: false
    enabled: true
  - query: "Nintendo 3DS XL"
    target_price: 100.0
    min_price: 40.0
    exclude_broken: false
    enabled: true
  - query: "Nintendo 3DS"
    target_price: 70.0
    min_price: 35.0
    exclude_broken: false
    enabled: true
  - query: "PS Vita"
    target_price: 100.0
    min_price: 40.0
    exclude_broken: false
    enabled: true

# Dizionario parole chiave per il rilevamento danni e calcolo voto (1-10)
damage_keywords:
  critical:
    penalty: 6.0
    label: "🚨 DIFETTO GRAVE / PER RICAMBI"
    keywords:
      - "non funzionante"
      - "per ricambi"
      - "uso ricambi"
      - "solo ricambi"
      - "ricambi"
      - "parti di ricambio"
      - "da riparare"
      - "da testare"
      - "non testato"
      - "non testata"
      - "scheda madre bruciata"
      - "bloccato icloud"
      - "blocco icloud"
      - "display rotto"
      - "schermo rotto"
      - "display spaccato"
      - "non si accende"
      - "non parte"
      - "vetro rotto"
      - "lcd rotto"
      - "danno da acqua"
      - "ossidato"
      - "for parts"
      - "not working"
      - "broken"
      - "defekt"
      - "hors service"
      - "pour pieces"
      - "cerniera rotta"
      - "cerniera spaccata"
      - "non legge i giochi"
      - "non legge giochi"
      - "non legge cartucce"
